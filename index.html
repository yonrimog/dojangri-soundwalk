<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f8f6ef"><title>양도면 사운드워크 · 현장 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6ef;color:#242820;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:12px}.mapbox{position:relative;width:100%;line-height:0;background:#fff;border-radius:10px;overflow:hidden}.poster{width:100%;height:auto;display:block}.start-pin{position:absolute;left:49%;top:61.1%;width:19px;height:19px;border:3px solid #fff;border-radius:50%;background:#2388ff;box-shadow:0 0 0 5px #2388ff35,0 1px 5px #0005;transform:translate(-50%,-50%);display:none;z-index:3}.start-pin.active{display:block;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}50%{opacity:.38;transform:translate(-50%,-50%) scale(1.35)}}.controls{background:#fffdf8;border:1px solid #e3e0d5;border-radius:14px;padding:16px;margin-top:12px}.intro{font-size:13px;color:#62675e;line-height:1.6;margin:0 0 12px}.btn{width:100%;border:0;border-radius:10px;padding:14px;background:#617a55;color:white;font-size:16px;font-weight:700}.btn:disabled{opacity:.6}.status{font-size:13px;color:#4c5548;margin-top:12px;line-height:1.65}.now{font-size:14px;font-weight:650;margin-top:12px}.small{font-size:11px;color:#888;margin-top:10px;line-height:1.55}audio{width:100%;margin-top:10px}.pill{display:inline-block;background:#eef3e9;color:#3d5836;border-radius:99px;padding:3px 8px;font-size:11px;margin-bottom:8px}
</style></head><body><main class="wrap"><div class="mapbox"><img class="poster" src="map.png" alt="강화도 양도면 사운드워크 그림 지도"><div id="pin" class="start-pin" aria-label="출발 지점 도착 표시"></div></div><section class="controls"><span class="pill">현장 테스트 · 1번 출발 지점만 활성화</span><p class="intro">출발 지점에서 GPS와 음원 재생을 시험하는 버전입니다. 아래 버튼을 누르고 위치 권한을 허용해 주세요.</p><button class="btn" id="start">GPS 테스트 시작</button><div class="status" id="status">아직 GPS를 시작하지 않았습니다.</div><div class="now" id="now"></div><audio id="player" controls style="display:none"></audio><div class="small">파란 점은 출발 지점에 도착했을 때 그림 지도 위에 깜빡이며 표시됩니다. 현재 위치가 그림 위를 따라 움직이는 기능은 지도 전체의 좌표 보정이 끝난 뒤 추가합니다. GPS 테스트는 HTTPS 웹사이트에서만 작동합니다.</div></section></main>
<script>
let config,watchId=null,played=false,busy=false;const $=id=>document.getElementById(id),player=$('player');
function distance(a,b,c,d){const R=6371000,to=x=>x*Math.PI/180,dl=to(c-a),dn=to(d-b),x=Math.sin(dl/2)**2+Math.cos(to(a))*Math.cos(to(c))*Math.sin(dn/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
async function load(){const r=await fetch('config.json',{cache:'no-store'});if(!r.ok)throw Error('설정 파일을 읽지 못했습니다.');config=await r.json()}
function pos(p){const {latitude,longitude,accuracy}=p.coords;const target=config.points.find(x=>x.id==='p1');const d=distance(latitude,longitude,target.lat,target.lng);$('status').textContent=`GPS 수신 중 · 현재 정확도 약 ${Math.round(accuracy)}m · 출발 지점까지 약 ${Math.round(d)}m`;
 if(accuracy<=50 && d<=target.radius){$('pin').classList.add('active');$('status').textContent=`출발 지점 도착 범위입니다 · GPS 오차 약 ${Math.round(accuracy)}m`;
  if(!played&&!busy){played=true;busy=true;$('now').textContent='출발 음원 재생';player.src=target.audio;player.style.display='block';player.play().catch(()=>{$('status').textContent+=' · 아래 재생 버튼을 눌러 주세요';busy=false});player.onended=()=>{busy=false;$('now').textContent='출발 음원 재생 완료'};}
 } else {$('pin').classList.remove('active');if(accuracy>50)$('status').textContent+=` · 정확도가 낮아 도착 판정을 보류합니다`;}}
function err(e){$('status').textContent='GPS 오류: '+e.message+' · 위치 권한과 휴대전화 GPS를 확인해 주세요.';$('start').disabled=false;$('start').textContent='다시 시도'}
$('start').onclick=async()=>{try{await load();const p=config.points.find(x=>x.id==='p1');if(!p||p.lat==null)throw Error('출발 지점 좌표가 없습니다.');if(!navigator.geolocation)throw Error('이 브라우저는 GPS를 지원하지 않습니다.');$('start').disabled=true;$('start').textContent='GPS 확인 중…';$('status').textContent='위치 권한을 요청하고 있습니다.';navigator.geolocation.getCurrentPosition(pos,err,{enableHighAccuracy:true,maximumAge:0,timeout:25000});watchId=navigator.geolocation.watchPosition(pos,err,{enableHighAccuracy:true,maximumAge:1000,timeout:25000});}catch(e){$('status').textContent=e.message;$('start').disabled=false;$('start').textContent='다시 시도'}};
</script></body></html>
