<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f8f6ef">
<title>도장리 사운드워크</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f6ef;color:#242820;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:auto;padding:12px}
.mapbox{position:relative;width:100%;line-height:0;background:#fff;border-radius:10px;overflow:hidden}
.poster{width:100%;height:auto;display:block}
.live-pin{position:absolute;left:50%;top:50%;width:20px;height:20px;border:3px solid #fff;border-radius:50%;background:#2388ff;box-shadow:0 0 0 5px #2388ff35,0 1px 5px #0005;transform:translate(-50%,-50%);display:none;z-index:5;pointer-events:none}
.live-pin.active{display:block;animation:pulse 1.35s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}50%{opacity:.42;transform:translate(-50%,-50%) scale(1.35)}}
.controls{background:#fffdf8;border:1px solid #e3e0d5;border-radius:14px;padding:16px;margin-top:12px}
.intro{font-size:13px;color:#62675e;line-height:1.6;margin:0 0 12px}
.btn{width:100%;border:0;border-radius:10px;padding:14px;background:#617a55;color:white;font-size:16px;font-weight:700}
.btn:disabled{opacity:.6}.status{font-size:13px;color:#4c5548;margin-top:12px;line-height:1.65}.now{font-size:14px;font-weight:650;margin-top:12px}
.small{font-size:11px;color:#888;margin-top:10px;line-height:1.55}audio{width:100%;margin-top:10px}
.pill{display:inline-block;background:#eef3e9;color:#3d5836;border-radius:99px;padding:3px 8px;font-size:11px;margin-bottom:8px}
</style>
</head>
<body>
<main class="wrap">
 <div class="mapbox">
  <img class="poster" id="map" src="map.png" alt="도장리 사운드워크 그림 지도">
  <div id="pin" class="live-pin" aria-label="현재 위치"></div>
 </div>
 <section class="controls">
  <span class="pill">GPS 현장 테스트 · 1~7번 지점</span>
  <p class="intro">GPS 테스트 시작을 누르고 위치 권한을 허용해 주세요. 산책길을 따라 현재 위치가 파란 점으로 표시되고, 각 지점에 도착하면 해당 음원이 재생됩니다.</p>
  <button class="btn" id="start">GPS 테스트 시작</button>
  <div class="status" id="status">아직 GPS를 시작하지 않았습니다.</div>
  <div class="now" id="now"></div>
  <audio id="player" controls preload="none" playsinline style="display:none"></audio>
  <div class="small">휴대전화의 위치 정확도에 따라 점의 위치와 도착 판정에 오차가 생길 수 있습니다. 화면을 켜 둔 상태로 사용해 주세요. iPhone Safari에서 자동 재생이 차단되면 표시되는 재생 버튼을 눌러 주세요.</div>
 </section>
</main>
<script>
let config=null,watchId=null,routeProgress=0,nextPointIndex=0,playing=false;
const played=new Set(),queue=[];
const $=id=>document.getElementById(id),player=$('player'),pin=$('pin');
// 일러스트 지도 위 지점 위치(가로/세로 퍼센트). 1~4번은 사용자 확인 위치,
// 5~7번은 점선 산책길과 GPS 좌표 순서를 바탕으로 우선 배치한 현장 보정용 근사값입니다.
const mapAnchors={
 p1:{x:49.5,y:70.7}, // 국자와 주걱 출발점
 p2:{x:73.5,y:58.3}, // 죽은 나무
 p3:{x:86.0,y:77.0}, // 흙집
 p4:{x:87.5,y:68.8}, // 사용자가 동그라미로 표시한 좌회전 지점
 p5:{x:79.0,y:37.5}, // 북동쪽 점선길 모서리(근사)
 p6:{x:14.0,y:45.0}, // 북서쪽 점선길 모서리(근사)
 p7:{x:12.0,y:77.0}  // 남서쪽 점선길 모서리(근사)
};
function distance(a,b,c,d){const R=6371000,to=x=>x*Math.PI/180,dl=to(c-a),dn=to(d-b),x=Math.sin(dl/2)**2+Math.cos(to(a))*Math.cos(to(c))*Math.sin(dn/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function project(lat,lng,refLat){const k=Math.cos(refLat*Math.PI/180);return {x:lng*k*111320,y:lat*110540}}
function routeLocation(lat,lng){
 const pts=config.points.filter(p=>mapAnchors[p.id]&&Number.isFinite(p.lat)&&Number.isFinite(p.lng));
 if(pts.length<2)return null;
 const refLat=pts.reduce((s,p)=>s+p.lat,0)/pts.length,here=project(lat,lng,refLat);
 let best=null;
 for(let i=0;i<pts.length-1;i++){
  const a=project(pts[i].lat,pts[i].lng,refLat),b=project(pts[i+1].lat,pts[i+1].lng,refLat);
  const vx=b.x-a.x,vy=b.y-a.y,den=vx*vx+vy*vy||1;
  const t=Math.max(0,Math.min(1,((here.x-a.x)*vx+(here.y-a.y)*vy)/den));
  const px=a.x+t*vx,py=a.y+t*vy,off=Math.hypot(here.x-px,here.y-py);
  const progress=i+t;
  if(!best||off<best.off)best={off,progress,i,t};
 }
 // GPS 잡음으로 파란 점이 이전 지점으로 되돌아가는 현상을 줄입니다.
 if(best&&best.off<100){routeProgress=Math.max(routeProgress,best.progress);}
 const seg=Math.min(pts.length-2,Math.floor(routeProgress));
 const t=Math.max(0,Math.min(1,routeProgress-seg));
 const a=mapAnchors[pts[seg].id],b=mapAnchors[pts[seg+1].id];
 if(!a||!b)return null;
 return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,off:best?best.off:Infinity};
}
function movePin(lat,lng){const p=routeLocation(lat,lng);if(!p||p.off>100){pin.classList.remove('active');return;}
 pin.style.left=p.x+'%';pin.style.top=p.y+'%';pin.classList.add('active');}
async function load(){const r=await fetch('config.json',{cache:'no-store'});if(!r.ok)throw Error('config.json을 읽지 못했습니다.');config=await r.json();if(!Array.isArray(config.points))throw Error('config.json의 points 목록을 확인해 주세요.');$('map').src=config.mapImage||'map.png';}
function activePoints(){return config.points.filter(p=>p.enabled&&Number.isFinite(p.lat)&&Number.isFinite(p.lng));}
function enqueuePoint(point){if(played.has(point.id)||queue.some(x=>x.id===point.id)||(playing&&player.dataset.pointId===point.id))return;played.add(point.id);queue.push(point);playNext();}
function playNext(){if(playing||!queue.length)return;const point=queue.shift();if(!point.audio){$('now').textContent=`${point.name}: 음원 경로가 비어 있습니다.`;playNext();return;}playing=true;player.dataset.pointId=point.id;$('now').textContent=`재생 중 · ${point.name}`;player.src=point.audio;player.style.display='block';player.load();player.play().catch(()=>{playing=false;$('status').textContent+=` · ${point.name} 자동 재생이 차단되었습니다. 아래 재생 버튼을 눌러 주세요.`;$('now').textContent=`재생 대기 · ${point.name}`;queue.unshift(point);});}
player.addEventListener('ended',()=>{playing=false;$('now').textContent='음원 재생 완료';playNext();});
player.addEventListener('error',()=>{if(player.currentSrc){playing=false;$('status').textContent+=' · 음원 파일을 열 수 없습니다. config.json의 audio 경로와 파일명을 확인해 주세요.';$('now').textContent='음원 파일 오류';}});
function checkArrival(lat,lng,accuracy){const pts=activePoints();if(!pts.length)return;
 // 지정된 순서대로 다음 지점만 판정합니다. GPS 오차를 고려하되 50m를 넘으면 보류합니다.
 while(nextPointIndex<pts.length&&played.has(pts[nextPointIndex].id))nextPointIndex++;
 if(nextPointIndex>=pts.length||accuracy>50)return;
 const p=pts[nextPointIndex],d=distance(lat,lng,p.lat,p.lng),tol=Math.max(Number(p.radius)||10,Math.min(accuracy,25));
 if(d<=tol){enqueuePoint(p);nextPointIndex++;}
}
function pos(position){const {latitude,longitude,accuracy}=position.coords;movePin(latitude,longitude);checkArrival(latitude,longitude,accuracy);
 const pts=activePoints();let nearest=null;for(const p of pts){const d=distance(latitude,longitude,p.lat,p.lng);if(!nearest||d<nearest.d)nearest={p,d};}
 $('status').textContent=`GPS 수신 중 · 오차 약 ${Math.round(accuracy)}m`+(nearest?` · 가까운 지점: ${nearest.p.name} ${Math.round(nearest.d)}m`:'');if(accuracy>50)$('status').textContent+=' · GPS 정확도가 낮아 도착 판정을 보류합니다.';
}
function err(e){$('status').textContent='GPS 오류: '+e.message+' · 위치 권한과 휴대전화 GPS 설정을 확인해 주세요.';$('start').disabled=false;$('start').textContent='다시 시도';}
$('start').onclick=async()=>{try{await load();const pts=activePoints();if(!pts.length)throw Error('활성화된 지점의 좌표를 확인해 주세요.');if(!navigator.geolocation)throw Error('이 브라우저는 GPS를 지원하지 않습니다.');$('start').disabled=true;$('start').textContent='GPS 수신 중…';$('status').textContent='위치 권한을 요청하고 있습니다.';navigator.geolocation.getCurrentPosition(pos,err,{enableHighAccuracy:true,maximumAge:0,timeout:25000});if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(pos,err,{enableHighAccuracy:true,maximumAge:1000,timeout:25000});}catch(e){$('status').textContent=e.message;$('start').disabled=false;$('start').textContent='다시 시도';}};
</script>
</body>
</html>
