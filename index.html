<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f8f6ef">
<title>도장리 사운드워크</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f6ef;color:#242820;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:auto;padding:12px}
.mapbox{position:relative;width:100%;line-height:0;background:#fff;border-radius:10px;overflow:hidden}
.poster{width:100%;height:auto;display:block}
.live-pin{position:absolute;left:50%;top:50%;width:20px;height:20px;border:3px solid #fff;border-radius:50%;background:#2388ff;box-shadow:0 0 0 5px #2388ff35,0 1px 5px #0005;transform:translate(-50%,-50%);display:none;z-index:5;pointer-events:none}
.live-pin.active{display:block;animation:pulse 1.35s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}50%{opacity:.42;transform:translate(-50%,-50%) scale(1.35)}}
.controls{background:#fffdf8;border:1px solid #e3e0d5;border-radius:14px;padding:16px;margin-top:12px}
.intro{font-size:13px;color:#62675e;line-height:1.6;margin:0 0 12px}
.btn{width:100%;border:0;border-radius:10px;padding:14px;background:#617a55;color:white;font-size:16px;font-weight:700}
.btn:disabled{opacity:.6}.status{font-size:13px;color:#4c5548;margin-top:12px;line-height:1.65}.now{font-size:14px;font-weight:650;margin-top:12px}
.small{font-size:11px;color:#888;margin-top:10px;line-height:1.55}audio{width:100%;margin-top:10px}#audioPanel{margin-top:12px}#audioPanel audio{display:block;width:100%;height:42px;margin:0 0 6px}#audioPanel audio.hidden{display:none}
.pill{display:inline-block;background:#eef3e9;color:#3d5836;border-radius:99px;padding:3px 8px;font-size:11px;margin-bottom:8px}
</style>
</head>
<body>
<main class="wrap">
 <div class="mapbox">
  <img class="poster" id="map" src="map.png" alt="도장리 사운드워크 그림 지도">
  <div id="pin" class="live-pin" aria-label="현재 위치"></div>
 </div>
 <section class="controls">
  <span class="pill">GPS 현장 테스트 · 1~7번 지점</span>
  <p class="intro">GPS 테스트 시작을 누르고 위치 권한을 허용해 주세요. 산책길을 따라 현재 위치가 파란 점으로 표시되고, 각 지점에 도착하면 해당 음원이 재생됩니다.</p>
  <button class="btn" id="start">GPS 테스트 시작</button>
  <div class="status" id="status">아직 GPS를 시작하지 않았습니다.</div>
  <div class="now" id="now"></div>
  <div id="arrivalDebug" class="small">다음 지점 대기 중</div>
  <div id="audioPanel" aria-label="음원 재생 조절"><audio id="audio0" class="hidden" controls playsinline preload="auto"></audio><audio id="audio1" class="hidden" controls playsinline preload="auto"></audio></div>
  <div class="small">휴대전화의 위치 정확도에 따라 점의 위치와 도착 판정에 오차가 생길 수 있습니다. 화면을 켜 둔 상태로 사용해 주세요. iPhone Safari에서 자동 재생이 차단되면 표시되는 재생 버튼을 눌러 주세요.</div>
 </section>
</main>
<script>
let config=null,watchId=null,routeProgress=0,nextPointIndex=0;
const STORAGE_KEY='dojangri_soundwalk_playback_v1';
const played=new Set();
const $=id=>document.getElementById(id),pin=$('pin');
const decks=[$('audio0'),$('audio1')];
decks.forEach(a=>{a.preload='auto';a.playsInline=true;a.loop=false;});
let pendingPointId=null,lastTriggerPosition=null,lastTriggerTime=0,insideCount=0;
let audioContext=null,gainNodes=[],sourceNodes=[];
let currentDeck=-1,currentPointId=null,fadeTimer=null,transitionToken=0;
let resumePointId=null,resumePending=false,lastRetryAt=0;
const FADE_OUT_MS=2000;
function savePlaybackState(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify({completed:[...played],currentPointId,nextPointIndex,resumePending}));}catch(e){}
}
function restorePlaybackState(){
 try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!v)return;
  if(Array.isArray(v.completed))v.completed.forEach(id=>played.add(id));
  currentPointId=typeof v.currentPointId==='string'?v.currentPointId:null;
  resumePointId=currentPointId;resumePending=!!currentPointId;
  nextPointIndex=Number.isInteger(v.nextPointIndex)?v.nextPointIndex:0;
 }catch(e){}
}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function prepareAudio(){
 const AudioCtx=window.AudioContext||window.webkitAudioContext;
 if(!AudioCtx)throw Error('이 브라우저는 부드러운 음원 전환을 지원하지 않습니다.');
 if(!audioContext){
  audioContext=new AudioCtx();
  decks.forEach((audio,i)=>{
   const source=audioContext.createMediaElementSource(audio);
   const gain=audioContext.createGain();gain.gain.value=0;
   source.connect(gain).connect(audioContext.destination);sourceNodes[i]=source;gainNodes[i]=gain;
  });
 }
 if(audioContext.state==='suspended')await audioContext.resume();
}
// 그림 지도 위 실제 GPS 좌표의 기준점. 사용자가 표시한 빨간 원이 p1입니다.
// 각 좌표 사이의 점선 굴곡을 따라 파란 점을 보간합니다.
const routeShapes={
 p1_p2:[[53.5,68.5],[58.5,69.8],[63.0,70.5]],
 p2_p3:[[63.0,70.5],[68.0,70.5],[70.0,67.5],[70.5,63.7]],
 p3_p4:[[70.5,63.7],[77.0,63.8],[83.5,66.0]],
 p4_p5:[[83.5,66.0],[82.5,58.0],[82.0,48.0],[83.0,39.5]],
 p5_p6:[[83.0,39.5],[65.0,41.5],[43.0,44.5],[16.0,47.2]],
 p6_p7:[[16.0,47.2],[12.8,55.0],[15.0,63.0],[15.5,68.5]],
 p7_p1:[[15.5,68.5],[25.0,66.5],[29.0,62.0],[36.0,61.5],[43.0,66.0],[48.0,68.2],[53.5,68.5]]
};
function interpolateShape(shape,t){
 const lengths=[0];let total=0;
 for(let i=1;i<shape.length;i++){total+=Math.hypot(shape[i][0]-shape[i-1][0],shape[i][1]-shape[i-1][1]);lengths.push(total);}
 const target=Math.max(0,Math.min(1,t))*total;
 for(let i=1;i<shape.length;i++)if(target<=lengths[i]){const span=lengths[i]-lengths[i-1]||1,u=(target-lengths[i-1])/span;return{x:shape[i-1][0]+(shape[i][0]-shape[i-1][0])*u,y:shape[i-1][1]+(shape[i][1]-shape[i-1][1])*u};}
 return{x:shape.at(-1)[0],y:shape.at(-1)[1]};
}
function distance(a,b,c,d){const R=6371000,to=x=>x*Math.PI/180,dl=to(c-a),dn=to(d-b),x=Math.sin(dl/2)**2+Math.cos(to(a))*Math.cos(to(c))*Math.sin(dn/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function project(lat,lng,refLat){const k=Math.cos(refLat*Math.PI/180);return {x:lng*k*111320,y:lat*110540}}
function routeLocation(lat,lng){
 const pts=activePoints();if(pts.length<2)return null;
 const ordered=[...pts];
 const refLat=ordered.reduce((s,p)=>s+p.lat,0)/ordered.length;
 const here=project(lat,lng,refLat);
 let best=null,nearest=null;
 // GPS 경로의 각 구간에 현재 좌표를 투영합니다. 이미 지나온 구간으로 되돌아가지 않도록 진행률을 유지합니다.
 for(let i=0;i<ordered.length;i++){
  const a=ordered[i],b=ordered[(i+1)%ordered.length];
  const ga=project(a.lat,a.lng,refLat),gb=project(b.lat,b.lng,refLat);
  const vx=gb.x-ga.x,vy=gb.y-ga.y,den=vx*vx+vy*vy||1;
  const t=Math.max(0,Math.min(1,((here.x-ga.x)*vx+(here.y-ga.y)*vy)/den));
  const off=Math.hypot(here.x-(ga.x+t*vx),here.y-(ga.y+t*vy));
  const candidate={off,index:i,t,progress:i+t};
  if(!nearest||off<nearest.off)nearest=candidate;
  if(candidate.progress>=routeProgress-0.25&&(!best||off<best.off))best=candidate;
 }
 best=best||nearest;if(!best)return null;
 if(best.off>45)return {off:best.off};
 routeProgress=Math.max(routeProgress,best.progress);
 const a=ordered[best.index],b=ordered[(best.index+1)%ordered.length];
 const key=a.id+'_'+b.id,shape=routeShapes[key];
 if(!shape)return {off:best.off};
 const loc=interpolateShape(shape,best.t);
 return{x:loc.x,y:loc.y,off:best.off};
}
function movePin(lat,lng){
 const p=routeLocation(lat,lng);
 if(!p||!Number.isFinite(p.x)||p.off>45){pin.classList.remove('active');return;}
 pin.style.left=p.x+'%';pin.style.top=p.y+'%';pin.classList.add('active');
}
async function load(){
 const r=await fetch('config.json',{cache:'no-store'});if(!r.ok)throw Error('config.json을 읽지 못했습니다.');config=await r.json();if(!Array.isArray(config.points))throw Error('config.json의 points 목록을 확인해 주세요.');
 $('map').src=config.mapImage||'map.png';restorePlaybackState();
 const pts=activePoints();
 if(resumePointId){const ri=pts.findIndex(p=>p.id===resumePointId);if(ri>=0){nextPointIndex=ri+1;resumePending=true;}else{currentPointId=null;resumePointId=null;resumePending=false;}}
 while(nextPointIndex<pts.length&&played.has(pts[nextPointIndex].id))nextPointIndex++;
}
function activePoints(){return config.points.filter(p=>p.enabled&&Number.isFinite(p.lat)&&Number.isFinite(p.lng));}
function stopDeck(index){const a=decks[index];a.pause();a.removeAttribute('src');a.load();a.classList.add('hidden');if(gainNodes[index]&&audioContext){gainNodes[index].gain.cancelScheduledValues(audioContext.currentTime);gainNodes[index].gain.setValueAtTime(0,audioContext.currentTime);}}
function setGain(index,value){if(gainNodes[index]&&audioContext){const g=gainNodes[index].gain;g.cancelScheduledValues(audioContext.currentTime);g.setValueAtTime(value,audioContext.currentTime);}}
async function playPoint(point,{resume=false}={}){
 if(!point.audio){$('now').textContent=`${point.name}: 음원 경로가 비어 있습니다.`;return false;}
 if(pendingPointId)return false;
 pendingPointId=point.id;const token=++transitionToken;
 if(fadeTimer){clearTimeout(fadeTimer);fadeTimer=null;}
 const oldIndex=currentDeck,newIndex=oldIndex===0?1:0,outgoing=oldIndex>=0?decks[oldIndex]:null;
 // 현재 음원이 실제 재생 중일 때만 2초 페이드아웃한 뒤 다음 음원을 시작합니다.
 if(outgoing&&!outgoing.paused&&!outgoing.ended){
  const g=gainNodes[oldIndex].gain,now=audioContext.currentTime;g.cancelScheduledValues(now);g.setValueAtTime(g.value,now);g.linearRampToValueAtTime(0,now+FADE_OUT_MS/1000);
  $('now').textContent=`전환 중 · ${point.name}`;await wait(FADE_OUT_MS);
  if(token!==transitionToken){pendingPointId=null;return false;}
 }
 if(outgoing)stopDeck(oldIndex);
 const incoming=decks[newIndex];incoming.src=new URL(point.audio,document.baseURI).href;incoming.loop=false;incoming.classList.remove('hidden');setGain(newIndex,1);incoming.load();
 try{
  await incoming.play();if(token!==transitionToken)return false;
  currentDeck=newIndex;currentPointId=point.id;pendingPointId=null;
  if(!resume){played.add(point.id);nextPointIndex=activePoints().findIndex(p=>p.id===point.id)+1;}
  resumePointId=point.id;resumePending=false;
  $('now').textContent=`재생 중 · ${point.name}`;savePlaybackState();
  incoming.onended=()=>{
   if(currentPointId!==point.id)return;
   played.add(point.id);currentPointId=null;resumePointId=null;resumePending=false;
   const pts=activePoints();nextPointIndex=Math.max(nextPointIndex,pts.findIndex(p=>p.id===point.id)+1);
   savePlaybackState();$('now').textContent=`재생 완료 · ${point.name}`;
  };
  return true;
 }catch(e){
  pendingPointId=null;setGain(newIndex,0);incoming.pause();incoming.classList.add('hidden');
  // 실패한 지점은 완료 처리하지 않아, 같은 좌표에 머물거나 페이지를 다시 열면 재시도합니다.
  currentPointId=point.id;resumePointId=point.id;resumePending=true;lastRetryAt=Date.now();savePlaybackState();
  $('now').textContent=`재생 오류 · ${point.name}`;$('status').textContent=`${point.name} 음원 재생 실패: ${e.message||'재생 오류'}`;return false;
 }
}
async function activatePoint(point){if(played.has(point.id)||pendingPointId)return;await playPoint(point);}
function checkArrival(lat,lng,accuracy){
 const pts=activePoints();if(!pts.length||pendingPointId)return;
 // 재접속 시 중단된 음원이 있으면, 그 지점 반경에 다시 들어왔을 때 해당 음원부터 재생합니다.
 if(resumePending&&resumePointId){const rp=pts.find(p=>p.id===resumePointId);if(rp){const rd=distance(lat,lng,rp.lat,rp.lng),rr=Math.max(1,Number(rp.radius)||10);$('arrivalDebug').textContent=`이어 듣기 대기 · ${rp.name} · 거리 ${Math.round(rd)}m / 반경 ${rr}m`;if(rd<=rr&&Date.now()-lastRetryAt>3000){insideCount++;if(insideCount>=2){insideCount=0;playPoint(rp,{resume:true});}}else if(rd>rr+5)insideCount=0;return;} }
 while(nextPointIndex<pts.length&&played.has(pts[nextPointIndex].id))nextPointIndex++;
 if(nextPointIndex>=pts.length){$('arrivalDebug').textContent='모든 지점의 음원 재생이 끝났습니다.';return;}
 const p=pts[nextPointIndex],d=distance(lat,lng,p.lat,p.lng),radius=Math.max(1,Number(p.radius)||10);
 // config.json에 지정한 지점별 반경을 그대로 적용합니다. GPS 오차값으로 반경을 임의 확대하지 않습니다.
 if(d<=radius){insideCount++;if(insideCount>=2){insideCount=0;activatePoint(p);}}
 else if(d>radius+5)insideCount=0;
 $('arrivalDebug').textContent=`다음: ${p.name} · 거리 ${Math.round(d)}m / 트리거 반경 ${radius}m · GPS 오차 ${Math.round(accuracy)}m`;
}
function pos(position){const {latitude,longitude,accuracy}=position.coords;movePin(latitude,longitude);checkArrival(latitude,longitude,accuracy);const pts=activePoints();let nearest=null;for(const p of pts){const d=distance(latitude,longitude,p.lat,p.lng);if(!nearest||d<nearest.d)nearest={p,d};}$('status').textContent=`GPS 수신 중 · 오차 약 ${Math.round(accuracy)}m`+(nearest?` · 가까운 지점: ${nearest.p.name} ${Math.round(nearest.d)}m`:'');}
function err(e){$('status').textContent='GPS 오류: '+e.message+' · 위치 권한과 휴대전화 GPS 설정을 확인해 주세요.';$('start').disabled=false;$('start').textContent='다시 시도';}
$('start').onclick=async()=>{try{await prepareAudio();await load();const pts=activePoints();if(!pts.length)throw Error('활성화된 지점의 좌표를 확인해 주세요.');if(!navigator.geolocation)throw Error('이 브라우저는 GPS를 지원하지 않습니다.');$('start').disabled=true;$('start').textContent='GPS 수신 중…';$('status').textContent='위치 권한을 요청하고 있습니다.';navigator.geolocation.getCurrentPosition(pos,err,{enableHighAccuracy:true,maximumAge:0,timeout:25000});if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(pos,err,{enableHighAccuracy:true,maximumAge:1000,timeout:25000});}catch(e){$('status').textContent=e.message;$('start').disabled=false;$('start').textContent='다시 시도';}};
window.addEventListener('pagehide',savePlaybackState);
</script>
</body>
</html>
