<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f6ef">
<title>도장리 사운드워크</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f8f6ef;color:#242820}
#map{height:100%;width:100%;background:#e8e8e8}
#panel{position:fixed;z-index:1000;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));top:auto;background:rgba(255,253,248,.96);backdrop-filter:blur(10px);border:1px solid #dedbd1;border-radius:14px;padding:13px 14px;box-shadow:0 3px 18px #0002;max-height:48vh;overflow:auto}
#title{font-size:16px;font-weight:750;margin-bottom:5px}
#status{font-size:13px;line-height:1.5;color:#394438}
#gps,#next{font-size:12px;color:#62675e;margin-top:4px;line-height:1.45}
#current{font-size:14px;font-weight:700;margin-top:7px}
#buttons{display:flex;gap:8px;margin-top:10px}
button{border:0;border-radius:9px;padding:10px 14px;background:#617a55;color:white;font-weight:700;font-size:13px}
button:disabled{opacity:.5}
#audio{display:block;width:100%;height:42px;margin-top:10px}
#hint{font-size:11px;color:#777;margin-top:6px;line-height:1.45}
.zone-label{background:rgba(30,35,30,.88);color:white;border-radius:6px;padding:3px 7px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px #0003}
.user-dot{width:18px;height:18px;border:3px solid white;border-radius:50%;background:#1677ff;box-shadow:0 0 0 7px #1677ff30,0 1px 6px #0006}
.leaflet-control-attribution{font-size:9px}
@media(max-height:650px){#panel{max-height:42vh;padding:10px 12px}#audio{height:38px}}
</style>
</head>
<body>
<div id="map" aria-label="도장리 사운드워크 지도"></div>
<section id="panel">
 <div id="title">도장리 사운드워크</div>
 <div id="status">시작 버튼을 누르고 위치 권한을 허용해 주세요.</div>
 <div id="gps">GPS 정확도와 현재 좌표가 여기에 표시됩니다.</div>
 <div id="current">아직 재생된 음원이 없습니다.</div>
 <div id="next">다음 지점: 1번 국자와 주걱 출발</div>
 <div id="buttons"><button id="start">사운드워크 시작</button><button id="center" disabled>내 위치로</button></div>
 <audio id="audio" controls playsinline preload="auto"></audio>
 <div id="hint">음원 재생 중에는 아래 재생바로 일시정지·탐색할 수 있습니다. 화면을 켜 두고 Safari에서 사용해 주세요.</div>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const map=L.map('map',{zoomControl:true}).setView([37.6537,126.4458],17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:20,attribution:'© OpenStreetMap contributors'
}).addTo(map);
let points=[],watchId=null,userMarker=null,accuracyCircle=null,lastFix=null;
let nextIndex=0,played=new Set(),playingIndex=-1,transitioning=false,lastTriggerAt=0,insideSamples=0;
const audio=$('audio');
audio.loop=false;
let audioUnlocked=false;
function setStatus(t){$('status').textContent=t}
function haversine(a,b,c,d){
 const R=6371000,r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r;
 const q=Math.sin(dl/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)**2;
 return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
}
function formatTime(v){if(!Number.isFinite(v))return '0:00';const m=Math.floor(v/60),s=Math.floor(v%60);return `${m}:${String(s).padStart(2,'0')}`;}
function updateNext(){
 while(nextIndex<points.length&&played.has(points[nextIndex].id))nextIndex++;
 $('next').textContent=nextIndex<points.length?`다음 지점: ${nextIndex+1}번 ${points[nextIndex].name} · 반경 ${points[nextIndex].radius}m`:'모든 지점의 음원 재생이 끝났습니다.';
}
function markPlayed(i){played.add(points[i].id);nextIndex=Math.max(nextIndex,i+1);playingIndex=-1;transitioning=false;updateNext();}
async function fadeOut(ms){
 if(audio.paused||audio.ended)return;
 const startVol=audio.volume,start=performance.now();
 return new Promise(resolve=>{
  const step=now=>{
   const t=Math.min(1,(now-start)/ms);audio.volume=startVol*(1-t);
   if(t<1)requestAnimationFrame(step);else{audio.pause();audio.volume=1;resolve();}
  };requestAnimationFrame(step);
 });
}
async function playPoint(i){
 if(transitioning||i!==nextIndex||i>=points.length||playingIndex===i)return;
 transitioning=true;const p=points[i];
 // Lock this point immediately, before awaiting play(), so duplicate GPS callbacks cannot restart it.
 playingIndex=i;
 try{
  if(!audioUnlocked)throw new Error('오디오가 잠겨 있습니다. 시작 버튼을 다시 눌러 주세요.');
  if(!audio.paused)await fadeOut(2000);
  audio.pause();audio.volume=1;audio.src=p.audio;audio.load();
  await audio.play();
  setStatus(`${i+1}번 지점 도착 · ${p.name} 재생 중`);
  $('current').textContent=`재생 중 · ${i+1}번 ${p.name}`;
 }catch(e){
  setStatus(`${i+1}번 음원 재생 실패: ${e.message||e}`);
  $('current').textContent=`재생 실패 · ${p.name} — 재생바의 ▶ 버튼을 눌러 다시 시도해 주세요.`;
  playingIndex=-1;transitioning=false;return;
 }
 transitioning=false;
}
audio.addEventListener('ended',()=>{
 if(playingIndex>=0){const i=playingIndex;markPlayed(i);$('current').textContent=`재생 완료 · ${i+1}번 ${points[i].name}`;}
});
audio.addEventListener('error',()=>{
 if(audio.src)setStatus(`음원 파일을 열지 못했습니다. 파일 경로를 확인해 주세요: ${audio.currentSrc}`);
});
audio.addEventListener('play',()=>{if(playingIndex>=0)$('current').textContent=`재생 중 · ${playingIndex+1}번 ${points[playingIndex].name}`;});
function addPointLabels(){
 points.forEach((p,i)=>{
  L.marker([p.lat,p.lng],{interactive:false,icon:L.divIcon({className:'',html:`<div class="zone-label">${i+1}. ${p.name}</div>`,iconSize:null,iconAnchor:[0,0]})}).addTo(map);
 });
}
function updateLocation(lat,lng,accuracy){
 const ll=[lat,lng];
 if(!userMarker){
  userMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map).bindTooltip('현재 위치');
  map.setView(ll,18);
 }else{
  userMarker.setLatLng(ll);
  // Follow the blue dot smoothly without repeatedly zooming or fighting user gestures.
  if(!map.getBounds().pad(-0.2).contains(ll))map.panTo(ll,{animate:true,duration:.5});
 }
 if(accuracyCircle){accuracyCircle.setLatLng(ll);accuracyCircle.setRadius(Math.min(accuracy,100));}
 else accuracyCircle=L.circle(ll,{radius:Math.min(accuracy,100),color:'#1677ff',weight:1,fillColor:'#1677ff',fillOpacity:.08,interactive:false}).addTo(map);
 lastFix={lat,lng,accuracy};
 $('gps').textContent=`현재 위치 ${lat.toFixed(6)}, ${lng.toFixed(6)} · GPS 오차 약 ±${Math.round(accuracy)}m`;
 $('center').disabled=false;
}
function checkTriggers(lat,lng,accuracy){
 if(transitioning||playingIndex===nextIndex||nextIndex>=points.length)return;
 const p=points[nextIndex],d=haversine(lat,lng,p.lat,p.lng);
 $('next').textContent=`다음 지점: ${nextIndex+1}번 ${p.name} · 거리 ${Math.round(d)}m / 반경 ${p.radius}m · GPS 오차 ±${Math.round(accuracy)}m`;
 // Keep the configured trigger radius exact. Do not silently enlarge it by reported GPS accuracy.
 if(d<=p.radius){
  insideSamples++;
  if(insideSamples>=2&&Date.now()-lastTriggerAt>5000){insideSamples=0;lastTriggerAt=Date.now();playPoint(nextIndex);}
 }else if(d>p.radius+5){insideSamples=0;}
}
function positionSuccess(pos){
 const {latitude,longitude,accuracy}=pos.coords;
 updateLocation(latitude,longitude,accuracy);
 checkTriggers(latitude,longitude,accuracy);
 setStatus(`GPS 연결됨 · 오차 ±${Math.round(accuracy)}m`);
}
function positionError(err){
 const msgs={1:'위치 권한이 거부되었습니다. iPhone 설정에서 Safari의 위치 접근과 정확한 위치를 허용해 주세요.',2:'기기에서 위치를 확인할 수 없습니다. 위치 서비스와 실외 GPS 수신을 확인해 주세요.',3:'GPS 응답 시간이 초과되었습니다. 잠시 후 다시 위치를 요청합니다.'};
 setStatus(`GPS 오류: ${msgs[err.code]||err.message}`);
}
function makeSilentWav(){
 // A valid 0.08-second silent PCM WAV, used only to unlock Safari audio from the start-button gesture.
 const b=new Uint8Array(44+Math.floor(8000*.08)*2),v=new DataView(b.buffer);
 const str=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};
 str(0,'RIFF');v.setUint32(4,b.length-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,b.length-44,true);
 let binary='';for(let i=0;i<b.length;i++)binary+=String.fromCharCode(b[i]);return 'data:audio/wav;base64,'+btoa(binary);
}
async function unlockFromTap(){
 audio.muted=true;audio.src=makeSilentWav();audio.load();
 try{await audio.play();audio.pause();audio.currentTime=0;audio.removeAttribute('src');audio.load();audio.muted=false;audioUnlocked=true;}
 catch(e){audio.muted=false;throw new Error('브라우저가 오디오 재생을 허용하지 않았습니다. Safari에서 페이지를 열고 다시 시작해 주세요.');}
}
async function start(){
 $('start').disabled=true;setStatus('음원과 GPS를 준비하고 있습니다…');
 try{
  if(!window.isSecureContext)throw new Error('GPS는 HTTPS 주소에서만 작동합니다.');
  if(!navigator.geolocation)throw new Error('이 브라우저는 GPS를 지원하지 않습니다.');
  const r=await fetch('config.json',{cache:'no-store'});if(!r.ok)throw new Error('config.json을 읽지 못했습니다.');
  const c=await r.json();points=c.points.filter(p=>p.enabled&&p.audio&&Number.isFinite(p.lat)&&Number.isFinite(p.lng));
  if(points.length!==7)throw new Error(`활성화된 GPS/음원 지점이 ${points.length}개입니다. 7개가 필요합니다.`);
  // Preflight every path so a missing later MP3 is caught before walking.
  for(let i=0;i<points.length;i++){
   const h=await fetch(points[i].audio,{method:'HEAD',cache:'no-store'});
   if(!h.ok)throw new Error(`${i+1}번 음원 파일을 찾지 못했습니다: ${points[i].audio} (HTTP ${h.status})`);
  }
  await unlockFromTap();
  addPointLabels();updateNext();
  setStatus('위치 권한을 확인하고 있습니다…');
  navigator.geolocation.getCurrentPosition(positionSuccess,positionError,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(positionSuccess,positionError,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  $('start').textContent='GPS 수신 중';
 }catch(e){setStatus(`시작 실패: ${e.message||e}`);$('start').disabled=false;$('start').textContent='다시 시도';}
}
$('start').addEventListener('click',start);
$('center').addEventListener('click',()=>{if(lastFix)map.setView([lastFix.lat,lastFix.lng],18);});
window.addEventListener('pagehide',()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);});
</script>
</body>
</html>
